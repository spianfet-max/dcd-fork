<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>DCD Fork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap">
<style>
/* Layout: calm grey ground, two white surfaces. Left, the live rate path that forks at the strike. Right, the two outcomes and the coupon accruing. UBS red marks conversion and nothing else. Light is the default; dark is switched by data-mode. */
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#000000; --mute:#707070; --line:#D8D8D8; --track:#E6E6E6; --rule:#000000; --goldf:#C7A011;
  --red:#E60000; --redtint:rgba(230,0,0,.06); --gold:#8A7015; --goldtint:rgba(199,160,17,.16); --shadow:none;
  --font:'Frutiger','Frutiger LT Std','Source Sans 3','Hiragino Kaku Gothic ProN','Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,-apple-system,sans-serif;
}
:root[data-mode="dark"]{
  --bg:#101112; --card:#19191B; --ink:#EEEEEC; --mute:#8B8E93; --line:#2A2B2E; --track:#3A3B3F;
  --red:#F03030; --redtint:rgba(240,48,48,.12); --gold:#D9B53A; --goldf:#C7A011; --rule:#EEEEEC; --goldtint:rgba(224,174,78,.15); --shadow:none; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-weight:500;font-size:15px;letter-spacing:.01em}
.brand span{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--track);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:38px;padding:0 16px;color:var(--mute);font-weight:500;transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--mute)}
.icon.sm{width:38px;height:38px}
.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){
  .side{display:grid!important;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:0!important;align-items:start}
  .side>*{padding-inline:24px}
  .side>:first-child{padding-left:0}
  .side>:last-child{padding-right:0}
  .side .cp,.side .net{border-top:0;padding-top:0;border-left:1px solid var(--line)}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500}
.big{font-size:40px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.tools{display:flex;align-items:center;gap:8px}
.pill{font-size:12px;font-weight:500;padding:7px 14px;border-radius:999px;background:var(--track);color:var(--ink);transition:background .25s,color .25s;white-space:nowrap}
.pill.conv{background:var(--redtint);color:var(--red)}
.plot{width:100%;position:relative}
.tip{position:absolute;left:0;top:0;width:min(300px,calc(100% - 8px));pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 28px rgba(28,29,31,.14);font-size:12px;line-height:1.55;z-index:5;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip h4{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--gold)}
.tip .f{color:var(--mute)}
.tip .n{font-size:14px;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.tip .n b{color:var(--gold);font-weight:500}
.plot svg{display:block;width:100%;touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
#fork,#fork:focus,#fork:focus-visible{outline:none;-webkit-tap-highlight-color:transparent}
.hint{color:var(--mute);font-size:12px;text-align:center;margin-top:4px}
.side{display:flex;flex-direction:column;justify-content:center;gap:28px}
/* svg parts */
.zone{fill:var(--redtint)}
.strike{stroke:var(--red);stroke-width:1;fill:none}
.mat{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.grd{stroke:var(--line);stroke-width:1;opacity:.6}
.hist2{fill:none;stroke:var(--mute);stroke-width:1;opacity:.35;stroke-linejoin:round}
.hist{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.oc{paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}.ocn{font-size:15px;font-weight:400;font-variant-numeric:tabular-nums}
.band{stroke:none}.band.b80{fill:var(--ink);opacity:.035}.band.b50{fill:var(--ink);opacity:.05}
:root[data-mode="dark"] .band.b80{opacity:.08}:root[data-mode="dark"] .band.b50{opacity:.11}
.trail{stroke-dasharray:5 5}
.ghost{fill:none;stroke:var(--mute);stroke-width:.9;opacity:.16;stroke-linejoin:round}
.ghost.gc{stroke:var(--red);opacity:.22}
.trail{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trail.conv{stroke:var(--red)}
.endp{fill:var(--ink);stroke:var(--card);stroke-width:3}
.endp.conv{fill:var(--red)}
.startp{fill:var(--mute)}
.t{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;font-family:var(--font)}
.tm{fill:var(--mute)} .tr{fill:var(--red)}
.halo{paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none}
/* outcomes */
.duo{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);align-items:center;justify-items:center}
.opt{container-type:inline-size;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;visibility:hidden}
.opt.on .tag{visibility:visible}
.coin{position:relative;width:88px;height:88px;border-radius:50%;border:1.5px solid var(--track);display:grid;place-items:center;font-size:20px;font-weight:500;letter-spacing:.06em;color:var(--mute);transform:scale(.88);transition:transform .35s,background .35s,color .35s,border-color .35s}
.opt.on .coin{transform:scale(1);background:var(--ink);border-color:var(--ink);color:var(--card)}
.opt.alt.on .coin{background:var(--red);border-color:var(--red);color:#fff}
.opt.base.on.pulse .coin::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--ink);animation:ring 2.4s ease-out infinite}
.nm{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500}
.amt{font-size:clamp(17px,13cqw,28px);font-weight:300;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;transition:color .3s}
.opt.on .amt{color:var(--ink);font-weight:400}
.amt2{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:-6px}
.opt.on .amt2{color:var(--ink)}
.link{position:relative;width:100%;height:2px;border-top:2px dotted var(--track);margin-top:38px}
.link::after{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red);opacity:0}
.link.conv::after{animation:flow 1.8s ease-in-out infinite}
@keyframes flow{0%{left:-4px;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 4px);opacity:0}}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.35);opacity:0}}
/* coupon */
.cp{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}
.cp-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cp-amt{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.cp-bar{position:relative;height:6px;border-radius:999px;background:var(--track);overflow:hidden}
.cp-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--gold);border-radius:999px}
.cp-tk{position:absolute;top:0;bottom:0;width:2px;background:var(--card);transform:translateX(-1px)}
.cp-f{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
/* sheet */
.veil[hidden]{display:none}
.veil{position:fixed;inset:0;background:rgba(15,16,17,.35);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
@media(min-width:640px){.veil{align-items:center}.sheet{border-radius:24px}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;min-width:0}
.fields input,.fields select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.fields .full{grid-column:1/-1}
.lab{display:flex;flex-direction:column;gap:6px}
.seg.wide button{flex:1}
.done{height:48px;border-radius:999px;border:0;background:var(--ink);color:var(--card);font-weight:500}
@media(max-width:520px){.big{font-size:34px}.card{padding:16px}.coin{width:76px;height:76px}.link{margin-top:34px}.cp-amt{font-size:26px}}
/* rate on the axis */
.rpill rect{fill:var(--ink)} .rpill text{fill:var(--card);font-size:11px;font-weight:500;font-family:var(--font)}
.rpill.conv rect{fill:var(--red)} .rpill.conv text{fill:#fff}
.rguide{stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3;opacity:0;transition:opacity .2s}
.rguide.on{opacity:.45}
/* strike handle, probabilities, history, effective rate */
.kh{fill:var(--red);stroke:var(--card);stroke-width:3;cursor:grab}
.khit{fill:transparent;cursor:grab}
.foot{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-top:6px}
.foot .hint{margin-top:0}
#histP{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
#histP{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
#histP .hm b{color:var(--red);font-weight:500}
#histP .hm{flex-basis:100%}
#histP .hy{display:inline-flex;gap:5px;align-items:baseline}
#histP .hy i{font-style:normal;font-size:11px;letter-spacing:.04em}
#histP .hy b{color:var(--red);font-weight:500}
.eff{font-size:12px;color:var(--mute);text-align:center;line-height:1.5}
.eff b{display:block;color:var(--gold);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
/* coupon in % */
.cp-head{display:flex;justify-content:center;padding-bottom:4px}
.cp-head .cp-pa b{font-size:48px;line-height:1.05}
.cp-head .cp-pa span{font-size:14px}
.cp-pa{display:flex;align-items:baseline;gap:6px;color:var(--gold)}
.cp-pa b{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.cp-pa span{font-size:12px;font-weight:500;letter-spacing:.04em}
.cp-per{font-size:12px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--goldtint);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.pk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px 12px;font-size:12px;font-variant-numeric:tabular-nums}
.pk .n{color:var(--mute);white-space:nowrap}
.pk .v{text-align:right;white-space:nowrap}
.pk .tr2{height:6px;border-radius:999px;background:var(--line);position:relative;overflow:hidden}
.pk .tr2 i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--mute)}
.pk .tr2 i.g{background:var(--gold)}
.pk-up{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pk-up b{font-size:18px;font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
/* coupon views: gold marks the coupon, red still marks conversion */
.cvbar{display:flex;align-items:center;gap:12px;overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.cvbar::-webkit-scrollbar{display:none}
.cvbar .lbl{flex:none}
.cvbar .seg{flex:none}
.cvbar .seg button{min-height:34px;padding:0 14px;font-size:13px}
:root[data-cv="1"] .cv:not(.cv1),:root[data-cv="2"] .cv:not(.cv2),:root[data-cv="3"] .cv:not(.cv3),:root[data-cv="4"] .cv:not(.cv4){display:none!important}
.cush{fill:var(--goldtint)}
.beline{stroke:var(--gold);stroke-width:1;stroke-dasharray:4 3;fill:none}
.tg{fill:var(--gold)}
.rib{fill:var(--line)} .ribf{fill:var(--gold)}
.mdot{fill:var(--card);stroke:var(--track);stroke-width:1.5;transition:fill .25s,stroke .25s}
.mdot.on{fill:var(--gold);stroke:var(--gold)}
.cpn{color:var(--gold)!important}
.opt:not(.on) .cpn{opacity:.55}
.pbx{width:100%;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:6px;opacity:.4;transition:opacity .3s}
.opt.on .pbx{opacity:1}
.pb-t{position:relative;width:100%;height:10px;border-radius:999px;background:var(--line);display:flex}
.pb-p{display:block;height:100%;background:var(--ink);border-radius:999px 0 0 999px;transition:width .12s}
.opt.alt .pb-p{background:var(--red)}
.pb-c{display:block;height:100%;background:var(--gold);border-radius:0 999px 999px 0;margin-left:2px}
.pb-m{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--mute);transform:translateX(-.75px)}
.pb-l{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.opt.on .pb-l{color:var(--ink)}
.net{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:12px}
.net-v{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums;color:var(--gold);transition:color .25s;white-space:nowrap}
.net-v.neg{color:var(--red)}
.net-g{position:relative;height:6px;border-radius:999px;background:var(--track)}
.net-g i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--gold)}
.net-g i.neg{background:var(--red)}
.net-g b{position:absolute;left:50%;top:-4px;bottom:-4px;width:1.5px;background:var(--mute);transform:translateX(-.75px)}
/* report style: white page, black hairline rules, square ochre bars, light type, red only as an accent */
body{font-weight:300}
.app{gap:0;padding-block:24px 40px}
.top{padding-bottom:20px}
.brand{padding-left:12px;border-left:2px solid var(--red)}
.brand b{font-size:20px;font-weight:300;letter-spacing:0}
.card{border:0;border-top:1px solid var(--rule);border-radius:0;padding:16px 0 28px;background:transparent}
.grid{gap:0}
.lbl,.nm,.tag,.fields label{text-transform:none;letter-spacing:.02em;font-size:12px;font-weight:400}
.t{text-transform:none;letter-spacing:.02em;font-weight:400}
.big{font-weight:300}
.seg{border-radius:0;padding:2px;background:var(--track)}
.seg button{border-radius:0;font-weight:400}
.icon{border-radius:0;border-color:var(--line)}
.pill,.cp-per{border-radius:0;font-weight:400}
.cp-bar,.cp-fill,.net-g,.net-g i,.pb-t,.pb-p,.pb-c,.pk .tr2,.pk .tr2 i{border-radius:0!important}
.cp-fill,.pb-c,.net-g i:not(.neg),.pk .tr2 i.g{background:var(--goldf)}
.pk .tr2 i{background:var(--gold)}
.pb-p{background:var(--ink)}
.cp-bar{height:8px}
.ribf{fill:var(--goldf)} .rib{fill:var(--track)}
.mdot.on{fill:var(--goldf);stroke:var(--goldf)}
.cush{fill:var(--goldtint)}
.zone{fill:rgba(230,0,0,.045)}
.grd{stroke:var(--line);opacity:1}
.coin{border-width:1px;font-weight:400}
.opt.on .coin{background:var(--ink);border-color:var(--ink)}
.side .cp,.side .net{border-color:var(--line)}
.cp,.net{border-top-color:var(--line)}
.cp-pa b,.net-v,.cp-amt,.amt{font-weight:300}
.tip{border-radius:0;border:0;border-top:2px solid var(--goldf);box-shadow:0 6px 24px rgba(0,0,0,.12)}
.done{border-radius:0}
.sheet{border-radius:0!important}
.fields input,.fields select{border-radius:0;background:#fff}
:root[data-mode="dark"] .fields input,:root[data-mode="dark"] .fields select{background:var(--bg)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><b data-i="brand"></b><span id="sub"></span></div>
    <div class="ctl">
      <div class="seg" role="group" aria-label="Language">
        <button id="lJa" type="button">日本語</button>
        <button id="lEn" type="button">EN</button>
      </div>
      <button class="icon" id="mode" type="button"></button>
      <button class="icon" id="gear" type="button" data-a="terms"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <div class="chead">
        <div><div class="lbl" data-i="rate"></div><div class="big" id="stv"></div></div>
        <div class="tools">
          <span class="pill" id="pill"></span>
          <button class="icon sm" id="play" type="button"></button>
        </div>
      </div>
      <div class="plot" id="plot"><svg id="fork" tabindex="0" role="slider"></svg><div class="tip" id="tip" role="tooltip"></div></div>
      <div class="foot"><span id="histP"></span><span class="hint" data-i="hint"></span></div>
    </section>

    <section class="card side">
      <div class="duo">
        <div class="opt base on" id="oB">
          <div class="tag" data-i="recv"></div>
          <div class="coin" id="cB"></div>
          <div class="nm" data-i="noconv"></div>
          <div class="amt" id="aB"></div>
          <div class="amt2 cpn" id="aBc"></div>
          <div class="pbx cv cv3"><div class="pb-t"><i class="pb-p" id="pB"></i><i class="pb-c" id="kB"></i><b class="pb-m" id="mB"></b></div><div class="pb-l" id="lB"></div></div>
        </div>
        <div class="link" id="lk"></div>
        <div class="opt alt" id="oA">
          <div class="tag" data-i="recv"></div>
          <div class="coin" id="cA"></div>
          <div class="nm" data-i="conv"></div>
          <div class="amt" id="aA"></div>
          <div class="amt2 cpn" id="aAc"></div>
          <div class="pbx cv cv3"><div class="pb-t"><i class="pb-p" id="pA"></i><i class="pb-c" id="kA"></i><b class="pb-m" id="mA"></b></div><div class="pb-l" id="lA"></div></div>
          <div class="eff"><span data-i="eff"></span><b id="effV"></b></div>
        </div>
      </div>
      <div class="cp">
        <div class="cp-head"><span class="cp-pa"><b id="cpPa"></b><span data-i="pa"></span></span></div>
        <div class="cp-row"><span class="lbl" data-i="coupon"></span><span class="cp-per" id="cpPer"></span></div>
        <div class="cp-row"><span class="cp-f" id="cpAmtL"></span><span class="cp-amt" id="cpAmt"></span></div>
        <div class="cp-bar cv cv1 cv3 cv4"><div class="cp-fill" id="cpFill"></div><div id="cpTk"></div></div>
        <div class="cp-f" id="cpF"></div>

  $('oA').classList.toggle('on',conv);$('lk').classList.toggle('conv',conv);
  $('fork').setAttribute('aria-valuetext',ST.toFixed(d.dec)+', '+(conv?t('conv'):t('noconv')));
  /* 3 · stacked bars, valued in the deposit currency at the dragged rate */
  var S=p.amt*(1+d.i)*1.08,cw=d.cp/S*100,vA=convVal(ST),bars=[['B',p.amt],['A',vA]];
  bars.forEach(function(b){$('p'+b[0]).style.width=Math.min(100-cw,b[1]/S*100)+'%';$('k'+b[0]).style.width=cw+'%';$('m'+b[0]).style.left=(p.amt/S*100)+'%'});
  $('lB').textContent='= '+money(p.amt+d.cp,d.dc);$('lA').textContent='≈ '+money(vA+d.cp,d.dc);
  /* 4 · net versus simply holding the deposit currency */
  var net=conv?vA+d.cp-p.amt:d.cp,nv=$('netV'),half=d.cp*2,fx=Math.max(-1,Math.min(1,net/half))*50,g=$('netG');
  nv.textContent=(net>=0?'+':'−')+money(Math.abs(net),d.dc);nv.classList.toggle('neg',net<0);
  g.style.left=(fx>=0?50:50+fx)+'%';g.style.width=Math.abs(fx)+'%';g.classList.toggle('neg',net<0);
  drawFork();
}

/* ---------- interaction ---------- */
var drag=false,fk=$('fork');
function fromY(e){
  var r=fk.getBoundingClientRect(),yy=e.clientY-r.top;
  var f=(yy-F.pt)/(F.H-F.pt-F.pb);f=Math.min(1,Math.max(0,f));
  ST=d.hi-f*(d.hi-d.lo);update();
}
var dragK=false,tip=$('tip');
function beTip(){var div=d.sign>0,ip=(d.i*100).toFixed(2)+'%';
  return '<h4>'+t('beH')+'</h4><div class="f">'+t('beF')(div)+'</div><div class="n">'+p.k.toFixed(d.dec)+(div?' ÷ ':' × ')+'(1 − '+ip+') = <b>'+d.be.toFixed(d.dec)+'</b></div><div>'+t('beX')(!div,money(d.Aa,d.ac),money(d.cp,d.dc),money(p.amt,d.dc))+'</div>'}
function nearBE(e){if(!F.y)return false;var r=fk.getBoundingClientRect(),px=(e.clientX-r.left)*F.W/r.width,py=e.clientY-r.top,yB=F.y(d.be),top=d.sign>0;
  if(px>=F.x0&&px<=F.x1)return Math.abs(py-yB)<8;
  if(px>F.x1){var a=top?yB-30:yB,b=top?yB:yB+30;return py>=a&&py<=b}return false}
function showTip(e){var r=fk.getBoundingClientRect(),pw=$('plot').clientWidth;tip.innerHTML=beTip();
  var w=tip.offsetWidth,h=tip.offsetHeight,yB=F.y(d.be),x=Math.max(0,Math.min(pw-w,e.clientX-r.left-w/2)),y=yB>h+24?yB-h-14:yB+16;
  tip.style.transform='translate('+x+'px,'+y+'px)';tip.classList.add('on')}
function hideTip(){tip.classList.remove('on')}
fk.addEventListener('pointermove',function(e){if(drag||dragK){hideTip();return}if(nearBE(e)){showTip(e);fk.style.cursor='help'}else{hideTip();if(!dragK)fk.style.cursor=''}});
fk.addEventListener('pointerleave',hideTip);
function kFromY(e){var r=fk.getBoundingClientRect(),f=(e.clientY-r.top-F.pt)/(F.H-F.pt-F.pb);f=Math.min(1,Math.max(0,f));
  var K=d.hi-f*(d.hi-d.lo);K=d.sign>0?Math.min(p.spot*1.12,Math.max(p.spot*1.0005,K)):Math.max(p.spot*.88,Math.min(p.spot*.9995,K));
  p.k=+K.toFixed(d.dec);p.auto=true;setTerms()}
fk.addEventListener('pointerdown',function(e){var r=fk.getBoundingClientRect();
  if(nearBE(e)&&(e.clientX-r.left)*F.W/r.width>F.x1){if(tip.classList.contains('on')&&e.pointerType!=='mouse')hideTip();else showTip(e);return}
  /* strike is fixed on the chart; it changes only in the terms sheet */
  drag=true;setAuto(false);try{fk.setPointerCapture(e.pointerId)}catch(_){}fromY(e)});
fk.addEventListener('pointermove',function(e){if(dragK)kFromY(e);else if(drag)fromY(e)});
function endK(){if(dragK){dragK=false;freezeR=null;fk.style.cursor='';setTerms()}}
fk.addEventListener('pointerup',function(){drag=false;endK()});
fk.addEventListener('pointercancel',function(){drag=false;endK()});
fk.addEventListener('keydown',function(e){
  var s=(d.hi-d.lo)/60,m=0;
  if(e.key==='ArrowUp'||e.key==='ArrowRight')m=1;else if(e.key==='ArrowDown'||e.key==='ArrowLeft')m=-1;else return;
  e.preventDefault();setAuto(false);ST=Math.min(d.hi,Math.max(d.lo,ST+m*s));update();
});
var PLAY='<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>',PAUSE='<svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>';
var t0=performance.now();
function phase(){var x=(ST-d.c)/(d.h*.82);x=Math.max(-1,Math.min(1,x));return Math.asin(x)/(2*Math.PI)*12000}
function setAuto(a){auto=a;t0=performance.now()-phase();var b=$('play');b.innerHTML=a?PAUSE:PLAY;b.setAttribute('aria-label',a?t('pause'):t('play'))}
$('play').addEventListener('click',function(){setAuto(!auto)});
var CT=7000;
function tick(ts){
  if(!document.hidden){
    if(auto){ST=d.c+d.h*.82*Math.sin((ts-t0)/1000*2*Math.PI/12);update()}
    if(reduced)drawCoupon(1);
    else{var c=(ts%CT)/CT,pr=c<.62?c/.62:1;pr=pr<.5?2*pr*pr:1-Math.pow(-2*pr+2,2)/2;drawCoupon(pr)}
  }
  requestAnimationFrame(tick);
}
$('lJa').addEventListener('click',function(){lang='ja';try{localStorage.setItem('dcd-lang',lang)}catch(e){}setTerms()});
$('lEn').addEventListener('click',function(){lang='en';try{localStorage.setItem('dcd-lang',lang)}catch(e){}setTerms()});
if($('cvSeg'))$('cvSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cv=b.getAttribute('data-k');try{localStorage.setItem('dcd-cv',cv)}catch(_){}document.documentElement.setAttribute('data-cv',cv);applyText();buildFork();update()});
document.documentElement.setAttribute('data-cv',cv);
$('mode').addEventListener('click',function(){mode=mode==='dark'?'light':'dark';try{localStorage.setItem('dcd-mode',mode)}catch(e){}applyMode()});

/* ---------- sheet ---------- */
var veil=$('veil');
function fill(){$('fPair').value=p.pair;$('fDep').value=p.amt.toLocaleString('en-US');$('fYld').value=p.y;$('fSpot').value=p.spot;$('fK').value=p.k;$('fM').value=p.m;$('fVol').value=p.vol;$('fBm').value=p.bm}
function openSheet(){fill();veil.hidden=false;$('done').focus()}
function closeSheet(){veil.hidden=true;$('gear').focus()}
$('gear').addEventListener('click',openSheet);$('done').addEventListener('click',closeSheet);
veil.addEventListener('click',function(e){if(e.target===veil)closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!veil.hidden)closeSheet()});
var map={fYld:'y',fSpot:'spot',fK:'k',fM:'m',fVol:'vol'};
Object.keys(map).forEach(function(id){
  $(id).addEventListener('input',function(){
    var v=parseFloat(this.value);if(!(v>0))return;
    if(id==='fM')v=Math.max(1,Math.round(v));
    p[map[id]]=v;if(id==='fYld')p.auto=false;setTerms();
  });
});
$('fDep').addEventListener('input',function(){
  var digits=this.value.replace(/[^0-9]/g,'');if(!digits)return;
  p.amt=parseInt(digits,10);this.value=p.amt.toLocaleString('en-US');setTerms();
});
function reset(){
  p.bm=BM[p.side==='b'?p.pair.slice(0,3):p.pair.slice(4)];
  p.spot=spotOf(p.pair);p.vol=volOf(p.pair);p.k=defStrike();
  derive();p.amt=defAmt(d.dc);ST=(p.spot+p.k)/2;fill();setTerms();
}
$('fBm').addEventListener('input',function(){var v=parseFloat(this.value);if(!(v>=0))return;p.bm=v;setTerms()});
$('fPair').addEventListener('change',function(){p.pair=this.value;reset()});
$('sdB').addEventListener('click',function(){if(p.side!=='b'){p.side='b';reset()}});
$('sdQ').addEventListener('click',function(){if(p.side!=='q'){p.side='q';reset()}});

/* ---------- boot ---------- */
var opt=function(x){return '<option>'+x+'</option>'};
$('fPair').innerHTML='<optgroup label="Main">'+TOP.map(opt).join('')+'</optgroup><optgroup label="G10">'+PAIRS.filter(function(x){return TOP.indexOf(x)<0}).map(opt).join('')+'</optgroup>';
derive();ST=d.c;applyMode();setTerms();setAuto(auto);
if(window.ResizeObserver){new ResizeObserver(function(){buildFork();update()}).observe($('plot'))}
else{addEventListener('resize',function(){buildFork();update()})}
requestAnimationFrame(tick);
function goLive(){
  var syms=ORD.filter(function(c){return c!=='USD'}).join(','),ac=window.AbortController?new AbortController():null;
  var to=setTimeout(function(){if(ac)ac.abort()},6000);
  fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols='+syms,ac?{signal:ac.signal}:{}).then(function(r){return r.json()}).then(function(j){
    clearTimeout(to);if(!j||!j.rates)return;
    for(var c in j.rates)UNITS[c]=j.rates[c];
    SRC.live=true;SRC.date=j.date||SRC.date;
    p.spot=spotOf(p.pair);p.k=defStrike();p.amt=defAmt(d.dc);ST=(p.spot+p.k)/2;setTerms();
  }).catch(function(){clearTimeout(to)});
}
goLive();
})();
</script>
